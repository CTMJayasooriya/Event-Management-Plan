
services:
  web:
    build: .
    container_name: event_management_web
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: student_event_management
      DB_USER: event_user
      DB_PASS: event_pass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: event_management_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_event_password
      MYSQL_DATABASE: student_event_management
      MYSQL_USER: event_user
      MYSQL_PASSWORD: event_pass
    ports:
      - "3307:3306"
    volumes:
      - event_db_data:/var/lib/mysql
      - ./db_structure.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_event_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: event_management_phpmyadmin
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  event_db_data:
